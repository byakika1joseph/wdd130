<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Rapids White Water Rafting Company</title>
    
    <meta name="description" content="Contact Rapids White Water Rafting in Kolob, California. View our location map, meet our guides, or send us a message to book today.">
    
    <meta name="author" content="Byakika Joseph">
    
    <link rel="stylesheet" href="styles/rafting.css">
</head>


<body>

    <header class="header-container">
        <img src="images/logo.jpg" alt="Rapids Logo" class="logo">
        <nav class="mainnav">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html" class="active">Contact Us</a>
        </nav> 
    </header>

    <main>

 <section class="company-profile">
    <h1>White Water Rafting Company</h1>
    <div class="company-address">
        <p>123 Main River Street</p>
        <p>Kolob, California</p>
        <p>Phone: <a href="tel:+19999999999">+1 999 999 9999</a></p>
        <p>Email: <a href="mailto:info@whitewater.com">info@whitewater.com</a></p>
    </div>
</section>

<section class="connect-blocks">
    <div class="map-container">
        <iframe 
            src="https://maps.google.com/maps?q=Kolob,California&t=&z=13&ie=UTF8&iwloc=&output=embed" 
            width="100%" height="450" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </div>

 <div class="form-box">
                <form action="#" method="post" class="contact-form">
                    
                    <div class="form-field">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="userName" placeholder="Your Name" required>
                    </div>

                    <div class="form-field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="userEmail" placeholder="Your Email" required>
                    </div>

                    <div class="form-field radio-group">
                        <span class="group-label">Message Purpose</span>
                        <label><input type="radio" name="purpose" value="General" checked> General Inquiry</label>
                        <label><input type="radio" name="purpose" value="Reservation"> Reservation Question</label>
                        <label><input type="radio" name="purpose" value="Suggestion"> Website Suggestion</label>
                    </div>

                    <div class="form-field">
                        <label for="message">Message</label>
                        <textarea id="message" name="userMessage" rows="5" placeholder="Type here..." required></textarea>
                    </div>

                    <div class="form-field checkbox-field">
                        <label>
                            <input type="checkbox" name="subscribe" value="yes" checked> 
                            Please Subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit" class="form-btn">Get in Touch!</button>
                </form>
            </div>
        </div>

        <section class="team-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                
                <figure class="profile-card">
                    <div class="profile-icon">👤</div>
                    <figcaption>
                        <h3>Byakika joseph</h3>
                        <p>Lead Guide</p>
                    </figcaption>
                </figure>

                <figure class="profile-card">
                    <div class="profile-icon">👤</div>
                    <figcaption>
                        <h3>Namala evas</h3>
                        <p>Trip Coordinator</p>
                    </figcaption>
                </figure>

                <figure class="profile-card">
                    <div class="profile-icon">👤</div>
                    <figcaption>
                        <h3>Byakika emmanuel</h3>
                        <p>Safety Director</p>
                    </figcaption>
                </figure>

            </div>
        </section>
    </main>

    <footer class="footer-container">
        <p class="footer-text">&copy;2026 | Rapids! | Susan Student</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.svg" alt="LinkedIn"></a>
            <a href="https://instagram.com"><img src="images/instagram.svg" alt="Instagram"></a>
        </nav>
    </footer>

</body>
</html>
